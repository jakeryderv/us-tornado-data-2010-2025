name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run offline regression tests
        run: uv run --offline --locked python -m unittest discover -s tests -v
      - name: Check download configuration without network requests
        run: uv run --offline --locked python download_data.py --dry-run
