[project]
name = "tornado-classification"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "pyarrow>=25.0.1",
    "geopandas>=1.1,<2",
]

[dependency-groups]
enrichment = [
    "requests>=2.32,<3",
    "python-dotenv>=1,<2",
    "rasterio>=1.4,<2",
]
era5 = [
    {include-group = "enrichment"},
    "cdsapi>=0.7.7,<1",
    "eccodes>=2.40,<3",
    "eccodeslib>=2.40,<3",
    "metpy>=1.7,<2",
]
publish = [
    "huggingface-hub>=1.31.0",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
]
